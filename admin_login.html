<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login &mdash; ShareSathi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/admin_login.css">
</head>
<body data-page="admin-login">
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">S</div>
      <div>
        <div class="login-logo-name">Share<span>Sathi</span></div>
        <div style="font-size:9px;color:var(--muted);letter-spacing:0.5px">ADMIN PANEL</div>
      </div>
    </div>
    <div class="login-title">Administrator Login</div>
    <div class="login-sub">Sign in to manage training data.</div>
    <div id="admin-login-error" class="alert alert-error" style="display:none"></div>
    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" placeholder="Enter username" autocomplete="off" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="Enter password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:4px">Sign In &rarr;</button>
    </form>
  </div>
</div>
<script src="/static/site.js"></script>
</body>
</html>
